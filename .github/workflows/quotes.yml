name: Market strip + deploy

# Builds the GitHub Pages site from main and adds a fresh quotes.json (no commits).
# Requires: Settings → Pages → Source = "GitHub Actions".
on:
  schedule:
    - cron: "2-59/15 9-23 * * 1-5"    # every 15 min from US pre-market to after-hours (UTC)
    - cron: "2-59/15 0 * * 2-6"       # after-hours runs until 01:00 UTC in winter
    - cron: "2,32 * * * *"         # every 30 min otherwise (FX, futures); off :00, where GitHub drops scheduled runs
  push:
    branches: [main]               # journal sync pushes deploy right away
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/quotes.py || echo "quotes failed, deploying without fresh data"
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets journal.enc.json _site/
          for f in quotes.json sectors.json; do [ -f "$f" ] && cp "$f" _site/ || true; done
          [ -d charts ] && cp -r charts _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  # separate job: avoids the "No artifacts named github-pages" race when deploy runs in the same job as the upload
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Market strip + deploy

# Builds the GitHub Pages site from main and adds a fresh market.json + live_base.json + charts/ (no commits).
# Requires: Settings → Pages → Source = "GitHub Actions".
on:
  schedule:
    # prices are live from the Cloudflare Worker (worker/); this build only refreshes daily data:
    # chart history, stages, rotation, checks and live_base.json. Off :00, where GitHub drops scheduled runs.
    - cron: "17 21 * * 1-5"         # after the US close (21:00 UTC winter / 20:00 summer): final daily bars
    - cron: "17 12 * * 1-5"         # before the US open: overnight futures / FX / BTC bars
    - cron: "17 12 * * 0,6"         # weekends: BTC daily bars
  push:
    branches: [main]               # journal sync pushes deploy right away
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cloudflare Pages deploy runs only once both repo secrets exist
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      # one source, one pass; if the whole run fails, republish the live site's last snapshot instead of none
      - run: python scripts/quotes.py || python scripts/quotes.py --restore || echo "no market data this run"
      # re-derive every number from its chart file; results go into market.json and show on the page (never blocks publishing)
      - run: "[ -f market.json ] && python scripts/check_market.py || true"
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets journal.enc.json _site/
          for f in market.json live_base.json; do [ -f "$f" ] && cp "$f" _site/ || true; done
          [ -d charts ] && cp -r charts _site/ || true
          # Leaders list: produced by leaders.yml on the data branch
          git fetch --depth 1 origin data 2>/dev/null && git show FETCH_HEAD:leaders.json > _site/leaders.json || rm -f _site/leaders.json
          # candle chart data for the listed leaders (lc/<ticker>.json)
          git archive FETCH_HEAD lc 2>/dev/null | tar -x -C _site || true
          touch _site/.nojekyll
      # Same site on Cloudflare Pages (trading-os.pages.dev), where Cloudflare Access puts a login in front of it
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list | grep -q " trading-os " || npx --yes wrangler@4 pages project create trading-os --production-branch main || true
          npx --yes wrangler@4 pages deploy _site --project-name trading-os --branch main --commit-dirty=true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  # separate job: avoids the "No artifacts named github-pages" race when deploy runs in the same job as the upload
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

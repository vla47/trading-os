name: Market strip

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: true

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/quotes.py
      - name: Commit quotes.json
        run: |
          git config user.name "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          git add quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "Update market strip" -q
          # GitHub Pages serves the gh-pages branch, which mirrors main
          git pull --rebase -q origin main
          git push -q origin HEAD:main HEAD:gh-pages
